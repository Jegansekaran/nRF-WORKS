# ================================================================
# prj.conf — VW101 BLE NUS firmware (nRF52832)
# ================================================================

# ── Kernel ──────────────────────────────────────────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_GPIO=y

# ── Serial / UART ───────────────────────────────────────────────
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y          # Polling UART — simpler, no ISR

# Disable UART console so UART0 is free for VW101
CONFIG_UART_CONSOLE=n

# ── Logging — RTT backend (no UART needed) ───────────────────────
CONFIG_LOG=n
CONFIG_LOG_DEFAULT_LEVEL=3         
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ── Bluetooth ───────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="VW_101"
CONFIG_BT_NUS=y
CONFIG_BT_NUS_LOG_LEVEL_INF=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=5

# NUS (Nordic UART Service)
CONFIG_BT_NUS=y

# ── NVS (flash storage) ─────────────────────────────────────────
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ── Math (powf for K reconstruction) ────────────────────────────
CONFIG_NEWLIB_LIBC=y                   # needed for powf / fabsf
# If you want to avoid newlib, replace powf() with a lookup table
# and remove this line — saves ~60 KB flash.

# ── Stack sizes ─────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=1200
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=1200
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=350
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

CONFIG_BT_USER_PHY_UPDATE=y