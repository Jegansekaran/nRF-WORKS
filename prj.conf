CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE0=y 
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_CONSOLE=y

CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="LOAD_CELL"
CONFIG_BT_NUS=y
CONFIG_BT_NUS_LOG_LEVEL_INF=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=5

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# Use crystal if available on your board for better BLE stability
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_BT_USER_PHY_UPDATE=y

# Tuned for 500ms streaming — was 1500ms which caused bursty BLE delivery
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=40
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=80
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=350

CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

CONFIG_GPIO=y
CONFIG_FPU=y